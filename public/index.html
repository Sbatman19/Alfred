<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#11141c" />
<title>Alfred</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #11141c;          /* midnight study */
    --panel: #1b202c;        /* mahogany shadow */
    --panel-2: #232938;
    --brass: #c9a24b;        /* the bell */
    --brass-bright: #e8cd84;
    --parchment: #ece5d3;
    --muted: #8d93a5;
    --line: rgba(201, 162, 75, 0.25);
    --danger: #c96b5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--parchment);
    font-family: "Karla", system-ui, sans-serif;
    display: flex; flex-direction: column;
    overscroll-behavior: none;
  }

  /* ---------- Header ---------- */
  header {
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 14px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(201,162,75,0.06), transparent);
  }
  .wordmark {
    font-family: "Cormorant Garamond", serif;
    font-size: 26px; font-weight: 600;
    letter-spacing: 0.42em; text-indent: 0.42em;
    color: var(--brass-bright);
  }
  .status {
    margin-top: 4px; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    min-height: 14px;
  }

  /* ---------- Transcript ---------- */
  main {
    flex: 1; overflow-y: auto;
    padding: 18px 16px 12px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 86%; line-height: 1.5; }
  .msg.you {
    align-self: flex-end;
    background: var(--panel-2);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px 14px 4px 14px;
    padding: 10px 14px; font-size: 15px;
  }
  .msg.alfred {
    align-self: flex-start;
    font-family: "Cormorant Garamond", serif;
    font-size: 19px; font-weight: 500; line-height: 1.45;
    border-left: 2px solid var(--brass);
    padding: 2px 0 2px 14px;
  }
  .msg.alfred .speaker {
    display: block; font-family: "Karla", sans-serif;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 4px;
  }
  .msg.error { align-self: center; color: var(--danger); font-size: 13px; }
  .empty {
    margin: auto; text-align: center; color: var(--muted);
    font-family: "Cormorant Garamond", serif; font-style: italic;
    font-size: 20px; padding: 0 30px; line-height: 1.5;
  }

  /* ---------- Dock: the bell ---------- */
  .dock {
    padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
    border-top: 1px solid var(--line);
    background: var(--panel);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .bell {
    position: relative;
    width: 108px; height: 108px; border-radius: 50%;
    border: 1px solid rgba(232,205,132,0.55);
    background:
      radial-gradient(circle at 34% 28%, #e8cd84 0%, #c9a24b 38%, #8a6c2a 80%, #6e5520 100%);
    box-shadow:
      0 6px 22px rgba(0,0,0,0.55),
      inset 0 2px 6px rgba(255,255,255,0.35),
      inset 0 -8px 14px rgba(0,0,0,0.35);
    color: #2c2410;
    font-family: "Karla", sans-serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; text-align: center;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: none;
    transition: transform 0.08s ease;
  }
  .bell::before {
    content: ""; position: absolute; inset: 10px; border-radius: 50%;
    border: 1px solid rgba(44,36,16,0.35);
    pointer-events: none;
  }
  .bell:active, .bell.listening { transform: scale(0.94); }
  .bell.listening { animation: ring 1.1s ease-out infinite; }
  @keyframes ring {
    0%   { box-shadow: 0 0 0 0 rgba(201,162,75,0.55), 0 6px 22px rgba(0,0,0,0.55), inset 0 2px 6px rgba(255,255,255,0.35); }
    100% { box-shadow: 0 0 0 26px rgba(201,162,75,0), 0 6px 22px rgba(0,0,0,0.55), inset 0 2px 6px rgba(255,255,255,0.35); }
  }
  .bell.busy { filter: grayscale(0.5) brightness(0.8); pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .bell.listening { animation: none; } }

  .typed { display: flex; gap: 8px; width: 100%; max-width: 520px; }
  .typed input {
    flex: 1; background: var(--ink); color: var(--parchment);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    padding: 11px 14px; font-size: 16px; font-family: "Karla", sans-serif;
  }
  .typed input:focus { outline: none; border-color: var(--brass); }
  .typed button {
    background: transparent; color: var(--brass);
    border: 1px solid var(--brass); border-radius: 10px;
    padding: 0 16px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  }
  .typed button:focus-visible, .bell:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 3px; }

  /* ---------- Login ---------- */
  .gate {
    position: fixed; inset: 0; background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 30px; z-index: 10; text-align: center;
  }
  .gate .wordmark { font-size: 38px; }
  .gate p { color: var(--muted); font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 19px; }
  .gate input {
    width: 100%; max-width: 320px;
    background: var(--panel); color: var(--parchment);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 13px 16px; font-size: 16px; text-align: center;
  }
  .gate input:focus { outline: none; border-color: var(--brass); }
  .gate button {
    width: 100%; max-width: 320px;
    background: linear-gradient(180deg, #d8b25e, #b08c3c);
    color: #241d0b; border: none; border-radius: 10px;
    padding: 13px; font-size: 14px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
  }
  .gate .err { color: var(--danger); font-size: 13px; min-height: 16px; font-family: "Karla", sans-serif; font-style: normal; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="wordmark">ALFRED</div>
  <p>"Some men aren't looking for anything logical.<br/>They're looking for their calendar."</p>
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
  <button id="loginBtn">Enter the study</button>
  <div class="err" id="loginErr"></div>
</div>

<header>
  <div class="wordmark">ALFRED</div>
  <div class="status" id="status">At your service</div>
</header>

<main id="transcript">
  <div class="empty" id="empty">Hold the bell and say,<br/>"Good morning, Alfred."</div>
</main>

<div class="dock">
  <div class="bell" id="bell" role="button" tabindex="0" aria-label="Hold to speak to Alfred">Hold to<br/>speak</div>
  <div class="typed">
    <input type="text" id="typedInput" placeholder="Or type to Alfred…" autocomplete="off" />
    <button id="typedSend">Send</button>
  </div>
</div>

<script>
(function () {
  var token = localStorage.getItem("alfred_token");
  var gate = document.getElementById("gate");
  var statusEl = document.getElementById("status");
  var transcript = document.getElementById("transcript");
  var emptyEl = document.getElementById("empty");
  var bell = document.getElementById("bell");
  var typedInput = document.getElementById("typedInput");
  var busy = false;

  // Reusable, gesture-unlocked audio element (iOS Safari requirement)
  var player = new Audio();
  var audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    player.src = "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7v///////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAAYZ4bbXSAAAAAAD/+xBkAA/wAABpAAAACAAADSAAAAEAAAGkAAAAIAAANIAAAARMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV";
    player.play().catch(function(){});
    audioUnlocked = true;
  }
  document.addEventListener("pointerdown", unlockAudio, { once: true });

  function setStatus(text) { statusEl.textContent = text; }

  function addMessage(kind, text) {
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    var div = document.createElement("div");
    div.className = "msg " + kind;
    if (kind === "alfred") {
      var s = document.createElement("span");
      s.className = "speaker"; s.textContent = "Alfred";
      div.appendChild(s);
      div.appendChild(document.createTextNode(text));
    } else {
      div.textContent = text;
    }
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign(
      { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      options.headers || {}
    );
    return fetch(path, options).then(function (r) {
      if (r.status === 401) { logout(); throw new Error("Session expired — please log in again."); }
      return r;
    });
  }

  function logout() {
    localStorage.removeItem("alfred_token");
    token = null;
    gate.classList.remove("hidden");
  }

  // ---------- Login ----------
  function login() {
    var pw = document.getElementById("password").value;
    var errEl = document.getElementById("loginErr");
    errEl.textContent = "";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { errEl.textContent = res.d.error || "Incorrect password."; return; }
        token = res.d.token;
        localStorage.setItem("alfred_token", token);
        gate.classList.add("hidden");
      })
      .catch(function () { errEl.textContent = "Could not reach the server."; });
  }
  document.getElementById("loginBtn").addEventListener("click", login);
  document.getElementById("password").addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });
  if (token) gate.classList.add("hidden");

  // ---------- Send + poll ----------
  function send(message) {
    if (busy || !message.trim()) return;
    busy = true;
    bell.classList.add("busy");
    addMessage("you", message);
    setStatus("One moment, sir…");

    api("/api/chat", { method: "POST", body: JSON.stringify({ message: message }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.jobId) throw new Error(d.error || "No job ID returned.");
        poll(d.jobId, 0);
      })
      .catch(function (err) { fail(err.message); });
  }

  function poll(jobId, attempts) {
    if (attempts > 90) return fail("Alfred took too long to respond.");
    setTimeout(function () {
      api("/api/chat/" + jobId)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.status === "processing") return poll(jobId, attempts + 1);
          if (d.status === "error") return fail(d.error || "Something went wrong.");
          addMessage("alfred", d.text);
          if (d.hasAudio) playAudio(jobId);
          done();
        })
        .catch(function (err) { fail(err.message); });
    }, 1000);
  }

  function playAudio(jobId) {
    api("/api/audio/" + jobId)
      .then(function (r) { return r.blob(); })
      .then(function (blob) {
        player.src = URL.createObjectURL(blob);
        player.play().catch(function () { /* user can re-tap if blocked */ });
      })
      .catch(function () {});
  }

  function done() { busy = false; bell.classList.remove("busy"); setStatus("At your service"); }
  function fail(msg) { addMessage("error", msg); done(); }

  // ---------- Typed input ----------
  document.getElementById("typedSend").addEventListener("click", function () {
    send(typedInput.value); typedInput.value = "";
  });
  typedInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { send(typedInput.value); typedInput.value = ""; }
  });

  // ---------- Push-to-talk (Web Speech API) ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  var finalTranscript = "";
  var listening = false;

  if (!SR) {
    bell.innerHTML = "Voice not<br/>supported";
    bell.style.pointerEvents = "none";
    setStatus("This browser lacks voice input — typing works");
  } else {
    recognition = new SR();
    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = function (e) {
      var interim = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (interim) setStatus("“" + interim.trim().slice(-60) + "”");
    };
    recognition.onerror = function (e) {
      if (e.error === "not-allowed") setStatus("Microphone permission denied");
      stopListening(false);
    };
    recognition.onend = function () {
      if (listening) stopListening(true); // ended on its own with text captured
    };

    function startListening(e) {
      if (busy || listening) return;
      if (e && e.preventDefault) e.preventDefault();
      unlockAudio();
      finalTranscript = "";
      listening = true;
      bell.classList.add("listening");
      setStatus("Listening, sir…");
      try { recognition.start(); } catch (_) {}
    }

    function stopListening(sendIt) {
      if (!listening) return;
      listening = false;
      bell.classList.remove("listening");
      try { recognition.stop(); } catch (_) {}
      setTimeout(function () {
        var text = finalTranscript.trim();
        finalTranscript = "";
        if (sendIt && text) send(text);
        else if (!busy) setStatus("At your service");
      }, 350); // brief grace period for the final result to land
    }

    bell.addEventListener("pointerdown", startListening);
    bell.addEventListener("pointerup", function () { stopListening(true); });
    bell.addEventListener("pointercancel", function () { stopListening(true); });
    bell.addEventListener("pointerleave", function () { if (listening) stopListening(true); });
    bell.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") startListening(e); });
    bell.addEventListener("keyup", function (e) { if (e.key === " " || e.key === "Enter") stopListening(true); });
  }
})();
</script>
</body>
</html>
