<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0e1118" />
<title>Alfred</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0e1118;
    --panel: #1b202c;
    --panel-2: #232938;
    --brass: #c9a24b;
    --brass-bright: #e8cd84;
    --parchment: #ece5d3;
    --muted: #8d93a5;
    --line: rgba(201, 162, 75, 0.25);
    --danger: #c96b5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -20%, #1a2030 0%, var(--ink) 55%);
    color: var(--parchment);
    font-family: "Karla", system-ui, sans-serif;
    display: flex; flex-direction: column;
    overscroll-behavior: none;
  }

  /* ---------- Header ---------- */
  header {
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 10px;
    text-align: center;
  }
  .wordmark {
    font-family: "Cormorant Garamond", serif;
    font-size: 24px; font-weight: 600;
    letter-spacing: 0.42em; text-indent: 0.42em;
    color: var(--brass-bright);
  }

  /* ---------- Orb stage ---------- */
  .stage {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 0 2px;
  }
  #orbWrap {
    width: min(54vw, 240px);
    height: min(54vw, 240px);
    cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: none;
    outline: none;
  }
  #orbWrap:focus-visible { border-radius: 50%; box-shadow: 0 0 0 2px var(--brass-bright); }
  #orb { width: 100%; height: 100%; display: block; }
  .status {
    margin-top: 2px; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted);
    min-height: 16px; text-align: center; padding: 0 24px;
  }
  .hint {
    font-family: "Cormorant Garamond", serif; font-style: italic;
    font-size: 15px; color: rgba(141,147,165,0.7); margin-top: 2px;
  }

  /* ---------- Transcript ---------- */
  main {
    flex: 1; overflow-y: auto;
    padding: 14px 16px 12px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 86%; line-height: 1.5; }
  .msg.you {
    align-self: flex-end;
    background: var(--panel-2);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px 14px 4px 14px;
    padding: 10px 14px; font-size: 15px;
  }
  .msg.alfred {
    align-self: flex-start;
    font-family: "Cormorant Garamond", serif;
    font-size: 19px; font-weight: 500; line-height: 1.45;
    border-left: 2px solid var(--brass);
    padding: 2px 0 2px 14px;
  }
  .msg.alfred .speaker {
    display: block; font-family: "Karla", sans-serif;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 4px;
  }
  .msg.error { align-self: center; color: var(--danger); font-size: 13px; }

  /* ---------- Dock ---------- */
  .dock {
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
    border-top: 1px solid var(--line);
    background: rgba(27,32,44,0.6);
    display: flex; justify-content: center;
  }
  .typed { display: flex; gap: 8px; width: 100%; max-width: 520px; }
  .typed input {
    flex: 1; background: rgba(14,17,24,0.8); color: var(--parchment);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    padding: 11px 14px; font-size: 16px; font-family: "Karla", sans-serif;
  }
  .typed input:focus { outline: none; border-color: var(--brass); }
  .typed button {
    background: transparent; color: var(--brass);
    border: 1px solid var(--brass); border-radius: 10px;
    padding: 0 16px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  }
  .typed button:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 3px; }

  /* ---------- Login ---------- */
  .gate {
    position: fixed; inset: 0; background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 30px; z-index: 10; text-align: center;
  }
  .gate .wordmark { font-size: 38px; }
  .gate p { color: var(--muted); font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 19px; }
  .gate input {
    width: 100%; max-width: 320px;
    background: var(--panel); color: var(--parchment);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 13px 16px; font-size: 16px; text-align: center;
  }
  .gate input:focus { outline: none; border-color: var(--brass); }
  .gate button {
    width: 100%; max-width: 320px;
    background: linear-gradient(180deg, #d8b25e, #b08c3c);
    color: #241d0b; border: none; border-radius: 10px;
    padding: 13px; font-size: 14px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
  }
  .gate .err { color: var(--danger); font-size: 13px; min-height: 16px; font-family: "Karla", sans-serif; font-style: normal; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="wordmark">ALFRED</div>
  <p>"Some men aren't looking for anything logical.<br/>They're looking for their calendar."</p>
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
  <button id="loginBtn">Enter the study</button>
  <div class="err" id="loginErr"></div>
</div>

<header>
  <div class="wordmark">ALFRED</div>
</header>

<div class="stage">
  <div id="orbWrap" role="button" tabindex="0" aria-label="Hold to speak to Alfred">
    <canvas id="orb"></canvas>
  </div>
  <div class="status" id="status">At your service</div>
  <div class="hint" id="hint">Hold the orb to speak</div>
</div>

<main id="transcript"></main>

<div class="dock">
  <div class="typed">
    <input type="text" id="typedInput" placeholder="Or type to Alfred…" autocomplete="off" />
    <button id="typedSend">Send</button>
  </div>
</div>

<script>
(function () {
  var token = localStorage.getItem("alfred_token");
  var gate = document.getElementById("gate");
  var statusEl = document.getElementById("status");
  var hintEl = document.getElementById("hint");
  var transcript = document.getElementById("transcript");
  var orbWrap = document.getElementById("orbWrap");
  var typedInput = document.getElementById("typedInput");
  var busy = false;

  // ==========================================================
  // ORB — brass/amber, four states: idle, listening, thinking, speaking
  // ==========================================================
  var canvas = document.getElementById("orb");
  var ctx = canvas.getContext("2d");
  var orbState = "idle";
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var W = 0, H = 0, CX = 0, CY = 0, BASE_R = 0;
  function sizeCanvas() {
    var rect = orbWrap.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width; H = rect.height;
    CX = W / 2; CY = H / 2;
    BASE_R = Math.min(W, H) * 0.27;
  }
  sizeCanvas();
  window.addEventListener("resize", sizeCanvas);

  // particles orbiting the core
  var PARTICLES = [];
  for (var i = 0; i < 42; i++) {
    PARTICLES.push({
      angle: Math.random() * Math.PI * 2,
      radius: 1.25 + Math.random() * 0.85,           // multiplier of BASE_R
      speed: (0.2 + Math.random() * 0.7) * (Math.random() < 0.5 ? 1 : -1),
      size: 0.6 + Math.random() * 1.6,
      tw: Math.random() * Math.PI * 2                // twinkle phase
    });
  }
  var ripples = []; // listening ripples

  // smoothed parameters
  var p = { scale: 1, speed: 0.35, glow: 0.35, level: 0 };
  var targets = {
    idle:      { scale: 1.0,  speed: 0.35, glow: 0.35 },
    listening: { scale: 1.16, speed: 1.1,  glow: 0.85 },
    thinking:  { scale: 0.9,  speed: 3.0,  glow: 0.55 },
    speaking:  { scale: 1.0,  speed: 0.8,  glow: 0.6 }
  };

  // Web Audio analyser for speaking state
  var audioCtx = null, analyser = null, freqData = null;
  var player = new Audio();
  var audioUnlocked = false;

  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.7;
      freqData = new Uint8Array(analyser.frequencyBinCount);
      var src = audioCtx.createMediaElementSource(player);
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
    } catch (_) { audioCtx = null; }
    // silent play to unlock the element itself
    player.src = "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7v///////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAAYZ4bbXSAAAAAAD/+xBkAA/wAABpAAAACAAADSAAAAEAAAGkAAAAIAAANIAAAARMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV";
    player.play().catch(function(){});
  }
  document.addEventListener("pointerdown", function () {
    unlockAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }, { once: false });

  player.addEventListener("play", function () { if (player.src.indexOf("blob:") === 0) setOrb("speaking"); });
  player.addEventListener("ended", function () { if (orbState === "speaking") setOrb("idle"); });
  player.addEventListener("pause", function () { if (orbState === "speaking") setOrb("idle"); });

  function setOrb(state) { orbState = state; }

  function currentLevel() {
    if (orbState !== "speaking") return 0;
    if (analyser && freqData) {
      analyser.getByteFrequencyData(freqData);
      var sum = 0;
      for (var i = 0; i < freqData.length; i++) sum += freqData[i];
      return Math.min(1, (sum / freqData.length) / 140);
    }
    // fallback pulse if Web Audio unavailable
    return 0.35 + 0.3 * Math.abs(Math.sin(performance.now() / 180));
  }

  var rotation = 0, lastT = performance.now();
  function lerp(a, b, t) { return a + (b - a) * t; }

  function draw(now) {
    requestAnimationFrame(draw);
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    var tg = targets[orbState] || targets.idle;
    var level = currentLevel();
    p.scale = lerp(p.scale, tg.scale + level * 0.3, 0.12);
    p.speed = lerp(p.speed, tg.speed, 0.08);
    p.glow  = lerp(p.glow,  tg.glow + level * 0.5, 0.15);
    rotation += dt * p.speed * (reducedMotion ? 0.15 : 1);

    var R = BASE_R * p.scale;
    ctx.clearRect(0, 0, W, H);

    // --- outer atmosphere ---
    var atm = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 2.4);
    atm.addColorStop(0, "rgba(232,205,132," + (0.20 * p.glow + 0.05) + ")");
    atm.addColorStop(0.5, "rgba(201,162,75," + (0.10 * p.glow) + ")");
    atm.addColorStop(1, "rgba(201,162,75,0)");
    ctx.fillStyle = atm;
    ctx.fillRect(0, 0, W, H);

    // --- listening ripples ---
    if (orbState === "listening" && !reducedMotion && Math.random() < 0.04) {
      ripples.push({ r: R, alpha: 0.5 });
    }
    for (var ri = ripples.length - 1; ri >= 0; ri--) {
      var rp = ripples[ri];
      rp.r += 60 * dt; rp.alpha -= 0.5 * dt;
      if (rp.alpha <= 0) { ripples.splice(ri, 1); continue; }
      ctx.beginPath();
      ctx.arc(CX, CY, rp.r, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(232,205,132," + rp.alpha.toFixed(3) + ")";
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    // --- orbital particles ---
    for (var pi = 0; pi < PARTICLES.length; pi++) {
      var pt = PARTICLES[pi];
      var a = pt.angle + rotation * pt.speed;
      var wob = Math.sin(now / 900 + pt.tw) * 0.06;
      var pr = R * (pt.radius + wob);
      // elliptical tilt for depth
      var px = CX + Math.cos(a) * pr;
      var py = CY + Math.sin(a) * pr * 0.62;
      var depth = (Math.sin(a) + 1) / 2; // 0 back, 1 front
      var tw = 0.35 + 0.65 * Math.abs(Math.sin(now / 700 + pt.tw));
      var alpha = (0.12 + 0.5 * depth) * tw * (0.5 + p.glow);
      ctx.beginPath();
      ctx.arc(px, py, pt.size * (0.6 + depth * 0.7), 0, Math.PI * 2);
      ctx.fillStyle = "rgba(232,205,132," + Math.min(0.9, alpha).toFixed(3) + ")";
      ctx.fill();
    }

    // --- rotating arcs (the rings) ---
    var arcs = [
      { r: 1.18, w: 1.4, span: 1.9, off: 0,    dir: 1,   alpha: 0.55 },
      { r: 1.38, w: 1.0, span: 1.1, off: 2.4,  dir: -0.7, alpha: 0.35 },
      { r: 1.58, w: 0.8, span: 0.7, off: 4.1,  dir: 0.45, alpha: 0.25 }
    ];
    for (var ai = 0; ai < arcs.length; ai++) {
      var arc = arcs[ai];
      var start = arc.off + rotation * arc.dir;
      ctx.beginPath();
      ctx.ellipse(CX, CY, R * arc.r, R * arc.r * 0.62, 0, start, start + arc.span);
      ctx.strokeStyle = "rgba(201,162,75," + (arc.alpha * (0.6 + p.glow * 0.6)).toFixed(3) + ")";
      ctx.lineWidth = arc.w;
      ctx.stroke();
    }

    // --- the core ---
    var core = ctx.createRadialGradient(CX - R * 0.25, CY - R * 0.3, R * 0.05, CX, CY, R);
    core.addColorStop(0, "rgba(255,240,200,0.95)");
    core.addColorStop(0.35, "rgba(232,205,132,0.85)");
    core.addColorStop(0.7, "rgba(176,140,60,0.55)");
    core.addColorStop(1, "rgba(120,92,38,0.05)");
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.fillStyle = core;
    ctx.fill();

    // inner hot center, breathes with voice
    var hotR = R * (0.32 + level * 0.22 + (reducedMotion ? 0 : 0.03 * Math.sin(now / 1200)));
    var hot = ctx.createRadialGradient(CX, CY, 0, CX, CY, hotR);
    hot.addColorStop(0, "rgba(255,250,230," + (0.55 + p.glow * 0.4) + ")");
    hot.addColorStop(1, "rgba(255,235,180,0)");
    ctx.beginPath();
    ctx.arc(CX, CY, hotR, 0, Math.PI * 2);
    ctx.fillStyle = hot;
    ctx.fill();
  }
  requestAnimationFrame(draw);

  // ==========================================================
  // App logic (same architecture as v1)
  // ==========================================================
  function setStatus(text) { statusEl.textContent = text; }

  function addMessage(kind, text) {
    var div = document.createElement("div");
    div.className = "msg " + kind;
    if (kind === "alfred") {
      var s = document.createElement("span");
      s.className = "speaker"; s.textContent = "Alfred";
      div.appendChild(s);
      div.appendChild(document.createTextNode(text));
    } else {
      div.textContent = text;
    }
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign(
      { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      options.headers || {}
    );
    return fetch(path, options).then(function (r) {
      if (r.status === 401) { logout(); throw new Error("Session expired — please log in again."); }
      return r;
    });
  }

  function logout() {
    localStorage.removeItem("alfred_token");
    token = null;
    gate.classList.remove("hidden");
  }

  // ---------- Login ----------
  function login() {
    var pw = document.getElementById("password").value;
    var errEl = document.getElementById("loginErr");
    errEl.textContent = "";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { errEl.textContent = res.d.error || "Incorrect password."; return; }
        token = res.d.token;
        localStorage.setItem("alfred_token", token);
        gate.classList.add("hidden");
      })
      .catch(function () { errEl.textContent = "Could not reach the server."; });
  }
  document.getElementById("loginBtn").addEventListener("click", login);
  document.getElementById("password").addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });
  if (token) gate.classList.add("hidden");

  // ---------- Send + poll ----------
  function send(message) {
    if (busy || !message.trim()) return;
    busy = true;
    setOrb("thinking");
    addMessage("you", message);
    setStatus("One moment, sir…");

    api("/api/chat", { method: "POST", body: JSON.stringify({ message: message }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.jobId) throw new Error(d.error || "No job ID returned.");
        poll(d.jobId, 0);
      })
      .catch(function (err) { fail(err.message); });
  }

  function poll(jobId, attempts) {
    if (attempts > 90) return fail("Alfred took too long to respond.");
    setTimeout(function () {
      api("/api/chat/" + jobId)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.status === "processing") return poll(jobId, attempts + 1);
          if (d.status === "error") return fail(d.error || "Something went wrong.");
          addMessage("alfred", d.text);
          if (d.hasAudio) playAudio(jobId);
          done(!d.hasAudio);
        })
        .catch(function (err) { fail(err.message); });
    }, 1000);
  }

  function playAudio(jobId) {
    api("/api/audio/" + jobId)
      .then(function (r) { return r.blob(); })
      .then(function (blob) {
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        player.src = URL.createObjectURL(blob);
        player.play().catch(function () { setOrb("idle"); });
      })
      .catch(function () { setOrb("idle"); });
  }

  function done(toIdle) {
    busy = false;
    if (toIdle) setOrb("idle"); // otherwise the 'play' event flips it to speaking
    setStatus("At your service");
  }
  function fail(msg) { addMessage("error", msg); busy = false; setOrb("idle"); setStatus("At your service"); }

  // ---------- Typed input ----------
  document.getElementById("typedSend").addEventListener("click", function () {
    send(typedInput.value); typedInput.value = "";
  });
  typedInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { send(typedInput.value); typedInput.value = ""; }
  });

  // ---------- Push-to-talk (Web Speech API) ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  var finalTranscript = "";
  var listening = false;

  if (!SR) {
    hintEl.textContent = "Voice input isn't supported in this browser — typing works";
    orbWrap.style.pointerEvents = "none";
  } else {
    recognition = new SR();
    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = function (e) {
      var interim = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (interim) setStatus("“" + interim.trim().slice(-60) + "”");
    };
    recognition.onerror = function (e) {
      if (e.error === "not-allowed") setStatus("Microphone permission denied");
      stopListening(false);
    };
    recognition.onend = function () {
      if (listening) stopListening(true);
    };

    function startListening(e) {
      if (busy || listening) return;
      if (e && e.preventDefault) e.preventDefault();
      if (orbState === "speaking") { player.pause(); } // interrupt Alfred politely
      finalTranscript = "";
      listening = true;
      setOrb("listening");
      setStatus("Listening, sir…");
      try { recognition.start(); } catch (_) {}
    }

    function stopListening(sendIt) {
      if (!listening) return;
      listening = false;
      try { recognition.stop(); } catch (_) {}
      setTimeout(function () {
        var text = finalTranscript.trim();
        finalTranscript = "";
        if (sendIt && text) send(text);
        else if (!busy) { setOrb("idle"); setStatus("At your service"); }
      }, 350);
    }

    orbWrap.addEventListener("pointerdown", startListening);
    orbWrap.addEventListener("pointerup", function () { stopListening(true); });
    orbWrap.addEventListener("pointercancel", function () { stopListening(true); });
    orbWrap.addEventListener("pointerleave", function () { if (listening) stopListening(true); });
    orbWrap.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") startListening(e); });
    orbWrap.addEventListener("keyup", function (e) { if (e.key === " " || e.key === "Enter") stopListening(true); });
  }
})();
</script>
</body>
</html>
